<style>

  --bg:#F6F7FB; --panel:#FFFFFF; --ink:#030F4F; --muted:#5A6185; --line:#D5D9EA;

}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#050A2E; --panel:#0B1442; --ink:#EEF0FF; --muted:#A3A9CF; --line:#27306B;

:root[data-theme="dark"]{ --bg:#050A2E; --panel:#0B1442; --ink:#EEF0FF; --muted:#A3A9CF; --line:#27306B;
  --target:#7C83AE; --you:#7E89FF; --good:#1FD082; --bad:#FF6B6B; }
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Barlow,Arial,Helvetica,sans-serif;font-size:17px;line-height:1.45}
header{display:flex;flex-wrap:wrap;align-items:baseline;gap:.4em 1.2em;padding:14px 20px 8px;max-width:1100px;margin:0 auto}
h1{font-family:"Barlow Condensed",Barlow,Arial,sans-serif;font-weight:600;font-size:2rem;margin:0;letter-spacing:.01em}
h1 span{color:var(--blue)}
nav{display:flex;gap:6px;margin-left:auto}
nav button{font:inherit;font-weight:600;border:2px solid var(--line);background:var(--panel);color:var(--ink);border-radius:999px;padding:4px 14px;cursor:pointer}
nav button[aria-current="true"]{border-color:var(--blue);background:var(--blue);color:#fff}
main{max-width:1100px;margin:0 auto;padding:0 20px 40px}
.banner{background:#FFF4D6;color:#5A4300;border-radius:8px;padding:6px 12px;margin:0 0 10px;font-size:.9rem}
.brief{margin:4px 0 12px;max-width:72ch}
.brief strong{color:var(--blue)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px}
canvas{display:block;width:100%;}
#scene{height:150px;border-radius:10px;background:linear-gradient(180deg,#DDE6FF,#F4F7FF)}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) #scene{background:linear-gradient(180deg,#0E1A5A,#0B1442)} }
#trace{height:230px;margin-top:10px}
.legend{display:flex;gap:16px;font-size:.85rem;color:var(--muted);margin-top:4px}
.legend i{display:inline-block;width:18px;height:3px;vertical-align:middle;margin-right:5px}
.controls{display:flex;flex-wrap:wrap;gap:14px 24px;align-items:flex-end;margin-top:12px}
.field{display:flex;flex-direction:column;gap:3px;min-width:150px}
.field label{font-size:.85rem;color:var(--muted)}
.field input[type=number]{font:inherit;font-size:1.15rem;width:8ch;padding:4px 8px;border:2px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
input[type=range]{accent-color:var(--blue)}
.btn{font:inherit;font-weight:700;font-size:1.05rem;border:none;border-radius:10px;padding:9px 18px;background:var(--blue);color:#fff;cursor:pointer}
.btn.secondary{background:transparent;color:var(--blue);border:2px solid var(--blue)}
.btn:disabled{opacity:.4;cursor:not-allowed}
button:focus-visible,input:focus-visible{outline:3px solid var(--green);outline-offset:2px}
.feedback{margin-top:12px;min-height:2.6em;font-size:1.05rem}
.feedback .good{color:var(--good);font-weight:700}
.feedback .bad{color:var(--bad);font-weight:700}
.shots{display:flex;gap:6px;align-items:center;color:var(--muted);font-size:.9rem}
.shots b{display:inline-block;width:14px;height:14px;border-radius:50%;background:var(--blue)}
.shots b.used{background:var(--line)}
/* equalizer */
.eq{display:grid;grid-template-columns:repeat(12,1fr);gap:6px;margin-top:12px}
.band{display:flex;flex-direction:column;align-items:center;gap:4px;background:var(--bg);border-radius:8px;padding:6px 2px}
.band .size{font-family:"Barlow Condensed",Barlow,Arial,sans-serif;font-weight:600;font-size:.95rem}
.band .unit{font-size:.7rem;color:var(--muted);margin-top:-4px}
.band input.amp{writing-mode:vertical-lr;direction:rtl;width:26px;height:120px}
.band input.ph{width:100%}
.band .phl{font-size:.68rem;color:var(--muted)}
.band.active{outline:3px solid var(--green)}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-top:12px}
.timer{font-family:"Barlow Condensed",Barlow,Arial,sans-serif;font-size:1.6rem;font-weight:600;min-width:3ch}
.score{font-size:1.05rem}
/* level 4 */
.suspects{display:grid;gap:10px;margin-top:8px}
.suspect{display:grid;grid-template-columns:3rem 1fr;align-items:center;gap:8px;background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:6px 10px;cursor:pointer;text-align:left;font:inherit;color:inherit}
.suspect .tag{font-family:"Barlow Condensed",Barlow,Arial,sans-serif;font-size:2rem;font-weight:600;text-align:center}
.suspect canvas{height:110px}
.suspect.real{border-color:var(--good)} .suspect.fake{opacity:.55}
.suspect.picked{box-shadow:0 0 0 4px var(--blue)}
#specs{height:260px;display:none;margin-top:10px}
@media (max-width:720px){
  .eq{grid-template-columns:repeat(6,1fr)} .band input.amp{height:90px}
  #trace{height:190px} h1{font-size:1.6rem}
}
@media (prefers-reduced-motion: reduce){ *{animation:none!important;transition:none!important} }

const TAU = 2*Math.PI;
let raf = null, timers = [];
function stopAll(){ cancelAnimationFrame(raf); raf = null; timers.forEach(clearInterval); timers = []; }
const rnd = (a,b,step=1) => a + step*Math.floor(Math.random()*((b-a)/step+1));
const rms = y => Math.sqrt(y.reduce((s,v)=>s+v*v,0)/y.length);
const sub = (a,b) => a.map((v,i)=>v-b[i]);
const variance = y => { const m=y.reduce((s,v)=>s+v,0)/y.length; return y.reduce((s,v)=>s+(v-m)**2,0)/y.length; };

/* ---------- drawing ---------- */
function fit(c){ const r=c.getBoundingClientRect(), d=devicePixelRatio||1;
  c.width=Math.round(r.width*d); c.height=Math.round(r.height*d);
  const g=c.getContext('2d'); g.setTransform(d,0,0,d,0,0); return [g,r.width,r.height]; }

function plot(c, series, opt={}){
  const [g,w,h]=fit(c); const pad={l:38,r:8,t:8,b:opt.noAxis?6:24};
  const n=series[0].y.length, tmax=opt.tmax||n;
  let ymax=opt.ymax||Math.max(...series.flatMap(s=>s.y.map(Math.abs)))*1.08||1;
  const X=i=>pad.l+(w-pad.l-pad.r)*i/(n-1), Y=v=>pad.t+(h-pad.t-pad.b)*(0.5-v/(2*ymax));
  g.font='12px Barlow, Arial'; g.fillStyle=css('--muted'); g.strokeStyle=css('--line'); g.lineWidth=1;
  if(!opt.noAxis){
    const step=opt.tick||10;
    for(let t=0;t<=tmax+1e-9;t+=step){ const x=pad.l+(w-pad.l-pad.r)*t/tmax;
      g.beginPath(); g.moveTo(x,pad.t); g.lineTo(x,h-pad.b); g.stroke();
      if(Math.round(t/step)%(opt.labelEvery||1)===0) g.fillText(t+' s',x-8,h-6); }
  }
  g.beginPath(); g.moveTo(pad.l,Y(0)); g.lineTo(w-pad.r,Y(0)); g.stroke();
  if(opt.fillProduct){ const p=opt.fillProduct;
    for(let i=0;i<n-1;i++){ g.fillStyle=p[i]>=0?'rgba(31,208,130,.35)':'rgba(153,0,0,.25)';
      g.fillRect(X(i),Math.min(Y(0),Y(p[i])),X(i+1)-X(i)+0.5,Math.abs(Y(p[i])-Y(0))); } }
  for(const s of series){ g.strokeStyle=s.color; g.lineWidth=s.width||2; g.beginPath();
    s.y.forEach((v,i)=>i?g.lineTo(X(i),Y(v)):g.moveTo(X(i),Y(v))); g.stroke(); }
  if(!opt.noAxis){ g.fillStyle=css('--muted'); g.fillText('u′ (m/s)',2,12); }
}

/* scene: eddies of the player's chosen sizes drifting past a mast */
function scene(c, eddies, U){
  stopAll(); const start=performance.now();
  const draw=now=>{
    const [g,w,h]=fit(c); const mPerPx=Math.max(4, Math.max(...eddies.map(e=>e.size),100)/ (h*0.42));
    const t=(now-start)/1000*(reduceMotion?0:1)*6; // 6× real time
    const mastX=w*0.72;
    g.strokeStyle=css('--ink'); g.lineWidth=3; g.beginPath(); g.moveTo(mastX,h); g.lineTo(mastX,h*0.25); g.stroke();
    g.fillStyle=css('--ink'); g.beginPath(); g.arc(mastX,h*0.25,5,0,TAU); g.fill();
    eddies.forEach((e,k)=>{ const rpx=e.size/2/mPerPx, sp=e.size/mPerPx, off=(U*t/mPerPx)%sp;
      const y=h*(0.5+(k? 0.12:-0.05));
      g.strokeStyle=k?css('--red'):css('--blue'); g.lineWidth=2;
      for(let x=-sp+off; x<w+sp; x+=sp){ g.globalAlpha=0.85; g.beginPath(); g.arc(x,y,Math.max(rpx,3),0,TAU); g.stroke();
        const a=-(U*t/(e.size/2))*1.0 + x*0.0; g.beginPath(); g.arc(x+Math.cos(a)*rpx,y+Math.sin(a)*rpx,3,0,TAU); g.fill(); }
      g.globalAlpha=1; });
    const bar=100/mPerPx; g.fillStyle=css('--ink'); g.fillRect(12,h-16,bar,3); g.font='12px Barlow, Arial'; g.fillText('100 m',12,h-22);
    g.fillText(`wind ${U} m/s →`, 12, 18);
    raf=requestAnimationFrame(draw); };
  raf=requestAnimationFrame(draw);
}

/* ---------- levels ---------- */
const briefs = {
1:'<strong>One eddy.</strong> A row of identical eddies is carried past the mast at 8 m/s. Grey is what the sonic measured. Find the eddy size and strength. Three shots and no preview, so work it out before you fire.',
2:'<strong>Two eddies, then more wind.</strong> Two rows of eddies of different sizes. Four shots. Then the wind picks up and you predict what the sonic sees.',
3:'<strong>Real wind.</strong> Ten minutes at Østerild, 103 m. Twelve eddy sizes, each with a strength and a position. You have 60 seconds to match it. Then ask the anemometer.',
4:'<strong>Spot the real one.</strong> All three traces have exactly the same spectrum. One is Østerild, two are forged. Which is real? Vote, then reveal.'
};

function setLevel(l){
  stopAll(); document.querySelectorAll('nav button').forEach(b=>b.setAttribute('aria-current', String(+b.dataset.l===l)));
  $('#brief').innerHTML=briefs[l]; history.replaceState(null,'','#level'+l);
  ({1:level1,2:level2,3:level3,4:level4})[l]();
}

function sineTrain(size,amp,U,t,ph=0){ return t.map(x=>amp*Math.sin(TAU*U*x/size+ph)); }

function level1(){
  const U=8, dt=0.5, tmax=180, t=Array.from({length:tmax/dt+1},(_,i)=>i*dt);
  const L=rnd(120,600,10), A=rnd(6,16)/10, target=sineTrain(L,A,U,t);
  let shots=3, you=null, done=false;
  $('#stage').innerHTML=`<canvas id="scene"></canvas><canvas id="trace"></canvas>
   <div class="legend"><span><i style="background:${css('--target')}"></i>measured</span><span><i style="background:${css('--you')}"></i>your eddies</span></div>
   <div class="controls">
    <div class="field"><label for="sz">eddy size ℓ (m)</label><input id="sz" type="number" min="20" max="1500" step="10" value="300"></div>
    <div class="field"><label for="am">strength (m/s): <output id="amo">1.0</output></label><input id="am" type="range" min="0" max="2" step="0.1" value="1"></div>
    <button class="btn" id="fire">Fire</button><div class="shots" id="shots"></div></div>
   <div class="feedback" id="fb"></div>`;
  const draw=()=>plot($('#trace'),[{y:target,color:css('--target'),width:3}].concat(you?[{y:you,color:css('--you')}]:[]),{tmax,tick:10,labelEvery:3});
  const pips=()=>$('#shots').innerHTML='shots '+[0,1,2].map(i=>`<b class="${i>=shots?'used':''}"></b>`).join('');
  $('#am').oninput=e=>$('#amo').textContent=(+e.target.value).toFixed(1);
  $('#sz').oninput=()=>scene($('#scene'),[{size:+$('#sz').value}],U);
  $('#fire').onclick=()=>{ if(done) return; const s=+$('#sz').value, a=+$('#am').value; shots--; pips();
    you=sineTrain(s,a,U,t); const err=rms(sub(you,target))/rms(target); draw();
    if(err<0.3){ done=true; $('#fb').innerHTML=`<span class="good">Hit, ${Math.round(err*100)} % error.</span> ${'★'.repeat(shots+1)} The period was ${(L/U).toFixed(1)} s, so ℓ = U × period = ${L} m. <button class="btn secondary" onclick="setLevel(2)">Next level</button>`; }
    else if(!shots){ done=true; $('#fb').innerHTML=`<span class="bad">Out of shots.</span> One crest every ${(L/U).toFixed(1)} s at 8 m/s means ℓ = 8 × ${(L/U).toFixed(1)} = ${L} m, strength ${A.toFixed(1)} m/s. <button class="btn secondary" onclick="setLevel(1)">Try a new eddy</button>`; }
    else $('#fb').innerHTML=`<span class="bad">Miss, ${Math.round(err*100)} % error.</span> Look at where your crests drift away from the grey ones.`; };
  pips(); draw(); scene($('#scene'),[{size:300}],U);
}

function level2(){
  const U=8, dt=0.5, tmax=180, t=Array.from({length:tmax/dt+1},(_,i)=>i*dt);
  const L1=rnd(300,640,20), L2=rnd(60,140,10), A1=rnd(8,15)/10, A2=rnd(4,8)/10;
  const target=sineTrain(L1,A1,U,t).map((v,i)=>v+sineTrain(L2,A2,U,[t[i]])[0]);
  let shots=4, you=null, stage='A';
  $('#stage').innerHTML=`<canvas id="scene"></canvas><canvas id="trace"></canvas>
   <div class="legend"><span><i style="background:${css('--target')}"></i>measured</span><span><i style="background:${css('--you')}"></i>your eddies</span></div>
   <div id="ctl"></div><div class="feedback" id="fb"></div>`;
  const draw=(tg,y)=>plot($('#trace'),[{y:tg,color:css('--target'),width:3}].concat(y?[{y,color:css('--you')}]:[]),{tmax,tick:10,labelEvery:3});
  const setA=()=>{ $('#ctl').innerHTML=`<div class="controls">
    <div class="field"><label for="s1">big eddy ℓ₁ (m)</label><input id="s1" type="number" step="10" value="400"></div>
    <div class="field"><label for="a1">strength₁: <output id="o1">1.0</output></label><input id="a1" type="range" min="0" max="2" step="0.1" value="1"></div>
    <div class="field"><label for="s2">small eddy ℓ₂ (m)</label><input id="s2" type="number" step="10" value="100"></div>
    <div class="field"><label for="a2">strength₂: <output id="o2">0.5</output></label><input id="a2" type="range" min="0" max="2" step="0.1" value="0.5"></div>
    <button class="btn" id="fire">Fire</button><div class="shots" id="shots">shots left: 4</div></div>`;
    $('#a1').oninput=e=>$('#o1').textContent=(+e.target.value).toFixed(1);
    $('#a2').oninput=e=>$('#o2').textContent=(+e.target.value).toFixed(1);
    const sc=()=>scene($('#scene'),[{size:+$('#s1').value},{size:+$('#s2').value}],U);
    $('#s1').oninput=sc; $('#s2').oninput=sc; sc();
    $('#fire').onclick=()=>{ shots--; $('#shots').textContent='shots left: '+shots;
      you=sineTrain(+$('#s1').value,+$('#a1').value,U,t).map((v,i)=>v+(+$('#a2').value)*Math.sin(TAU*U*t[i]/(+$('#s2').value)));
      const err=rms(sub(you,target))/rms(target); draw(target,you);
      if(err<0.3||!shots){ $('#fire').disabled=true;
        $('#fb').innerHTML=(err<0.3?`<span class="good">Hit, ${Math.round(err*100)} % error.</span> `:`<span class="bad">Out of shots.</span> `)+
        `The eddies were ${L1} m and ${L2} m. <button class="btn secondary" id="toB">The wind picks up</button>`;
        $('#toB').onclick=setB; }
      else $('#fb').innerHTML=`<span class="bad">Miss, ${Math.round(err*100)} % error.</span> Fix the big eddy first: it sets the slow swings.`; };
  };
  const setB=()=>{ stage='B'; const U2=14;
    $('#ctl').innerHTML=`<div class="controls"><div class="field"><label for="pp">Same two eddies, wind now ${U2} m/s. Period of the big eddy at the sonic (s)?</label>
      <input id="pp" type="number" step="0.5" value=""></div><button class="btn" id="commit">Commit</button></div>`;
    $('#fb').textContent='Commit a number before you see the new trace.';
    draw(target,null); scene($('#scene'),[{size:L1},{size:L2}],U);
    $('#commit').onclick=()=>{ const p=+$('#pp').value; if(!p){ $('#fb').textContent='Type a number first.'; return; }
      const truth=L1/U2, tg2=sineTrain(L1,A1,U2,t).map((v,i)=>v+A2*Math.sin(TAU*U2*t[i]/L2));
      draw(tg2,null); scene($('#scene'),[{size:L1},{size:L2}],U2);
      const ok=Math.abs(p-truth)/truth<0.1;
      $('#fb').innerHTML=`${ok?'<span class="good">Right.</span>':'<span class="bad">Not quite.</span>'} ℓ₁ / U = ${L1} / ${U2} = ${truth.toFixed(1)} s (it was ${(L1/U).toFixed(1)} s at ${U} m/s). Same eddies, faster wind: shorter periods. <button class="btn secondary" onclick="setLevel(3)">Next level</button>`;
      $('#commit').disabled=true; };
  };
  draw(target,null); setA();
}

/* level 3: real wind, 12 harmonics of the 600 s record */
const NS=[1,2,3,4,6,8,12,16,24,32,48,64];
function level3(){
  const u=WIND.u, N=u.length, Trec=N/WIND.fs, t=u.map((_,i)=>i/WIND.fs), U=WIND.U;
  const amp=NS.map(()=>0), ph=NS.map(()=>0);
  let left=60, running=false, locked=false;
  $('#stage').innerHTML=`<canvas id="trace"></canvas>
   <div class="legend"><span><i style="background:${css('--target')}"></i>Østerild u′</span><span><i style="background:${css('--you')}"></i>your 12 eddies</span></div>
   <div class="eq" id="eq">${NS.map((n,k)=>`<div class="band" id="b${k}"><span class="size">${Math.round(U*Trec/n)}</span><span class="unit">m</span>
     <input class="amp" type="range" min="0" max="1.2" step="0.02" value="0" aria-label="strength of ${Math.round(U*Trec/n)} m eddies" data-k="${k}">
     <input class="ph" type="range" min="0" max="360" step="5" value="0" aria-label="position of ${Math.round(U*Trec/n)} m eddies" data-k="${k}"><span class="phl">position</span></div>`).join('')}</div>
   <div class="row"><span class="timer" id="tm">60</span><span class="score" id="sc">variance matched: 0 %</span>
     <button class="btn secondary" id="giveup">Stop the clock</button><button class="btn" id="anemo" disabled>Ask the anemometer</button></div>
   <div class="feedback" id="fb">Big eddies on the left, small on the right. Each bar is one eddy size; its slider below shifts where its crests sit.</div>`;
  const mix=()=>t.map(x=>NS.reduce((s,n,k)=>s+amp[k]*Math.cos(TAU*n*x/Trec-ph[k]*Math.PI/180),0));
  const score=y=>1-variance(sub(u,y))/variance(u);
  const draw=(extra=[],opt={})=>{ const y=mix(); plot($('#trace'),[{y:u,color:css('--target'),width:1.2},{y,color:css('--you'),width:2.2}].concat(extra),{tmax:600,tick:60,...opt});
    $('#sc').textContent=`variance matched: ${Math.round(100*score(y))} %`; return y; };
  const lock=()=>{ locked=true; stopAll(); document.querySelectorAll('.eq input').forEach(i=>i.disabled=true);
    $('#anemo').disabled=false; $('#giveup').disabled=true; const s=score(mix());
    $('#fb').innerHTML=`Your score: <b>${Math.round(100*s)} %</b>. Write it down. Now let the anemometer try, with the same 12 eddy sizes.`; };
  $('#eq').oninput=e=>{ if(locked) return; const k=+e.target.dataset.k;
    if(e.target.classList.contains('amp')) amp[k]=+e.target.value; else ph[k]=+e.target.value;
    if(!running){ running=true; timers.push(setInterval(()=>{ left--; $('#tm').textContent=left; if(left<=0) lock(); },1000)); }
    draw(); };
  $('#giveup').onclick=lock;
  $('#anemo').onclick=async ()=>{ $('#anemo').disabled=true; const yours=Math.round(100*score(mix()));
    for(let k=0;k<NS.length;k++){
      const n=NS[k], c=t.map(x=>Math.cos(TAU*n*x/Trec)), s=t.map(x=>Math.sin(TAU*n*x/Trec));
      const dot=(a,b)=>a.reduce((S,v,i)=>S+v*b[i],0);
      const a=dot(u,c)/dot(c,c), b=dot(u,s)/dot(s,s);
      document.querySelectorAll('.band').forEach(el=>el.classList.remove('active')); $('#b'+k).classList.add('active');
      $('#fb').innerHTML=`${Math.round(U*Trec/n)} m eddies: multiply the wind by a wave with ${n} period${n>1?'s':''} in 10 min and add up the shaded area. Green counts plus, red counts minus. Then do it again with the wave shifted a quarter period.`;
      plot($('#trace'),[{y:u,color:css('--target'),width:1.2},{y:c.map(v=>v*Math.max(...u.map(Math.abs))*0.6),color:css('--blue'),width:1.5}],{tmax:600,tick:60,fillProduct:u.map((v,i)=>v*c[i])});
      await new Promise(r=>setTimeout(r,reduceMotion?150:(k<3?1500:500)));
      amp[k]=Math.hypot(a,b); ph[k]=(Math.atan2(b,a)*180/Math.PI+360)%360;
      $(`#b${k} .amp`).value=amp[k]; $(`#b${k} .ph`).value=ph[k];
    }
    document.querySelectorAll('.band').forEach(el=>el.classList.remove('active'));
    const best=Math.round(100*score(draw()));
    $('#fb').innerHTML=`The anemometer: <b>${best} %</b> with 12 sizes. You: <b>${yours} %</b>. Ten minutes at 20 Hz allows 6000 sizes. How many would you need for 90 %? That is Round 1.`;
  };
  draw();
}

/* level 4: same spectrum, random phases */
function dft(x){ const N=x.length, re=new Float64Array(N), im=new Float64Array(N);
  for(let k=0;k<=N/2;k++){ let r=0,i=0; for(let n=0;n<N;n++){ const a=-TAU*k*n/N; r+=x[n]*Math.cos(a); i+=x[n]*Math.sin(a);} re[k]=r; im[k]=i; } return [re,im]; }
function forge(u){ const N=u.length, [re,im]=dft(u), out=new Float64Array(N);
  const A=[], P=[]; for(let k=1;k<=N/2;k++){ A.push(Math.hypot(re[k],im[k])*(k===N/2?1:2)/N); P.push(Math.random()*TAU); }
  for(let n=0;n<N;n++){ let s=0; for(let k=1;k<=N/2;k++) s+=A[k-1]*Math.cos(TAU*k*n/N+P[k-1]); out[n]=s; } return Array.from(out); }
function periodogram(x){ const N=x.length, [re,im]=dft(x), f=[], S=[];
  for(let k=1;k<N/2;k++){ f.push(k*WIND.fs/N); S.push((re[k]**2+im[k]**2)*2/(N*N)); }
  const sm=S.map((_,i)=>{ const a=Math.max(0,i-3), b=Math.min(S.length,i+4); return S.slice(a,b).reduce((p,q)=>p+q,0)/(b-a); });
  return [f,sm]; }
function level4(){
  const u=WIND.u.slice(); const m=u.reduce((s,v)=>s+v,0)/u.length; const real=u.map(v=>v-m);
  let traces, order, voted=false;
  $('#stage').innerHTML=`<div class="suspects" id="sus"></div>
    <div class="row"><button class="btn secondary" id="reveal">Reveal</button><button class="btn secondary" id="spec">Show the three spectra</button><button class="btn secondary" id="again">Forge again</button></div>
    <canvas id="specs"></canvas><div class="feedback" id="fb">Click the trace you think is real.</div>`;
  const build=()=>{ voted=false; traces=[real,forge(real),forge(real)]; order=[0,1,2].sort(()=>Math.random()-0.5);
    $('#sus').innerHTML=order.map((k,j)=>`<button class="suspect" data-j="${j}"><span class="tag">${'ABC'[j]}</span><canvas></canvas></button>`).join('');
    const ymax=Math.max(...traces.flatMap(y=>y.map(Math.abs)));
    document.querySelectorAll('.suspect').forEach((b,j)=>{ plot($('canvas',b),[{y:traces[order[j]],color:css('--ink'),width:1.1}],{ymax,noAxis:true});
      b.onclick=()=>{ document.querySelectorAll('.suspect').forEach(x=>x.classList.remove('picked')); b.classList.add('picked'); voted=j;
        $('#fb').textContent=`You picked ${'ABC'[j]}. What made you pick it? Then reveal.`; }; });
    $('#specs').style.display='none'; $('#fb').textContent='Click the trace you think is real.'; };
  $('#reveal').onclick=()=>{ document.querySelectorAll('.suspect').forEach((b,j)=>b.classList.add(order[j]===0?'real':'fake'));
    const jr=order.indexOf(0);
    $('#fb').innerHTML=(voted===false?'':(order[voted]===0?'<span class="good">Caught it.</span> ':'<span class="bad">Fooled.</span> '))+
      `${'ABC'[jr]} is Østerild. Same variance, same spectrum, same memory. The forgeries got the sizes right and the positions random, so their jumps are Gaussian. Did ${'ABC'[jr]} have a sharp ramp the others lack?`; };
  $('#spec').onclick=()=>{ const c=$('#specs'); c.style.display='block'; const [g,w,h]=fit(c); const pad=40;
    const all=traces.map(periodogram); const fmin=Math.log10(all[0][0][0]), fmax=Math.log10(all[0][0].at(-1));
    const Sv=all.flatMap(a=>a[1]).filter(v=>v>0), smin=Math.log10(Math.min(...Sv)), smax=Math.log10(Math.max(...Sv));
    const X=f=>pad+(w-pad-10)*(Math.log10(f)-fmin)/(fmax-fmin), Y=s=>10+(h-pad-10)*(1-(Math.log10(s)-smin)/(smax-smin));
    g.fillStyle=css('--muted'); g.font='12px Barlow, Arial'; g.fillText('frequency (log) →',w/2-40,h-8); g.fillText('S (log)',4,14);
    [css('--good'),css('--blue'),css('--red')].forEach((col,k)=>{ g.strokeStyle=col; g.lineWidth=k?1.5:2.5; g.beginPath();
      all[k][0].forEach((f,i)=>{ const v=Math.max(all[k][1][i],1e-12); i?g.lineTo(X(f),Y(v)):g.moveTo(X(f),Y(v)); }); g.stroke(); });
    g.fillText('green: real · blue, red: forgeries',w-220,14); };
  $('#again').onclick=build; build();
}

document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>setLevel(+b.dataset.l));
if(WIND.placeholder) $('#placeholder').hidden=false;
const m=location.hash.match(/level(\d)/); setLevel(m?+m[1]:1);
addEventListener('resize',()=>{ const l=+(location.hash.match(/level(\d)/)||[0,1])[1]; if(l===1||l===2) return; });
</script>
